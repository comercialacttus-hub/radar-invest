/* Layout: app de uma coluna (máx. 480px) com barra de abas fixa embaixo; terminal escuro, âmbar como destaque */
:root {

* { box-sizing: border-box; }
html, body { height: 100%; }

body { margin: 0; -webkit-font-smoothing: antialiased; }

.btn { min-height: 48px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 0 18px; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.status { font-family: var(--font-num); font-size: 10px; border: 1px solid var(--line); border-radius: 20px; padding: 6px 10px; color: var(--muted); white-space: nowrap; }
.status.on { color: var(--up-soft); border-color: var(--up-line); }
.avatar { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }

.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); } .acc { color: var(--accent); }
.eyebrow { font-family: var(--font-num); font-size: 10px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }
h1 { margin: 0; font-size: 24px; font-weight: 800; text-wrap: balance; }
h2 { margin: 0; font-size: 16px; font-weight: 800; text-wrap: balance; }
.top { padding: 18px 16px 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.card.up-c { background: var(--up-bg); border-color: var(--up-line); }
.card.down-c { background: var(--down-bg); border-color: var(--down-line); }
.card.hero-acc { background: var(--accent); color: var(--accent-ink); border: 0; }
.card.hero-acc .eyebrow { color: var(--accent-ink); font-weight: 700; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

.tile .k { font-size: 11px; color: var(--muted); }

.tabs { display: flex; gap: 18px; margin-top: 10px; border-bottom: 1px solid var(--line-soft); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 0 0 8px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; min-height: 36px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 16px 4px; scrollbar-width: none; }

.li:last-child { border-bottom: 0; }

.hscroll { display: flex; gap: 10px; overflow-x: auto; padding-inline: 16px; margin-inline: -16px; scrollbar-width: none; }

.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

.pill.up { background: var(--up-bg); color: var(--up-soft); } .pill.down { background: var(--down-bg); color: var(--down-soft); } .pill.neu { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
.dots { display: flex; gap: 3px; } .dots span { width: 18px; height: 8px; border-radius: 2px; background: var(--line); } .dots span.on { background: var(--accent); }
.note { font-size: 11px; color: var(--muted); line-height: 1.45; }
.flow { display: flex; align-items: center; gap: 8px; font-family: var(--font-num); font-size: 12px; }
.flow .lab { width: 34px; color: var(--muted); } .flow .track { flex: 1; } .flow .track i { display: block; height: 14px; border-radius: 4px; } .flow .val { width: 82px; text-align: right; }
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; background: #0B0F15; border-top: 1px solid var(--line-soft); padding: 6px 4px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
nav.bottom .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
nav.bottom button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; color: var(--muted); font-size: 10px; }
nav.bottom button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.back { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; }
.follow { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-size: 12px; font-weight: 700; }
.follow[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.demo { margin: 4px 16px 0; font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; line-height: 1.4; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl td, .tbl th { padding: 9px 0; border-bottom: 1px solid var(--line-soft); text-align: left; }
.tbl th { font-size: 11px; color: var(--muted); font-weight: 600; }
.tbl td.r, .tbl th.r { text-align: right; }
.brand { display: none; }
/* Desktop: menu lateral fixo + conteúdo em duas colunas */
@media (min-width: 1024px) {
  body { font-size: 15px; }
  .app { max-width: 1180px; margin: 0 auto; padding: 24px 40px 48px 280px; }
  nav.bottom { top: 0; bottom: 0; right: auto; width: 230px; border-top: 0; border-right: 1px solid var(--line-soft); padding: 28px 16px; }
  nav.bottom .in { display: flex; flex-direction: column; gap: 4px; max-width: none; }
  nav.bottom .brand { display: block; font-weight: 800; font-size: 20px; padding: 0 12px 24px; color: var(--fg); }
  nav.bottom button { flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 14px; padding: 0 12px; border-radius: 10px; min-height: 44px; }
  nav.bottom button:hover { background: var(--surface); color: var(--fg); }
  nav.bottom button[aria-current="page"] { background: var(--surface); }
  .top { padding: 8px 0 12px; }
  h1 { font-size: 30px; }
  .wrap { padding-inline: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; grid-auto-flow: row dense; }
  .wrap > .tall { grid-row: span 3; }
  .wrap > .wide { grid-column: 1 / -1; }
  .wrap > .chips, .wrap > .note { grid-column: 1 / -1; }
  .chips { padding-inline: 0; }
  .hscroll { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; overflow: visible; }
  .demo { margin: 20px 0 0; }
  .tabs { max-width: 640px; }
  .grid3.coins { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .app header.row { padding-inline: 0; }
  .ficha-top { display: grid; grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { .screen { animation: in .18s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>

  function telaExterior() {

    var head = '<header class="top"><h1>Exterior</h1><div class="tabs" role="tablist">' + tipos.map(function (t) { return '<button role="tab" data-extipo="' + t + '" aria-selected="' + (state.exTipo === t) + '">' + t + '</button>'; }).join("") + '</div></header>';
    var cambio = '<section class="card"><div class="eyebrow">Efeito do dólar no seu retorno</div><div class="note" style="font-size:13px;margin-top:4px">O dólar caiu 9,4% no ano. O mesmo S&amp;P 500 rendeu bem menos em reais.</div>' +
      '<div style="display:flex;flex-direction:column;gap:10px;margin-top:12px" class="num"><div><div class="row" style="font-size:13px"><span>VOO · em dólar</span><span class="up" style="font-weight:700">+15,1%</span></div><div style="height:10px;border-radius:5px;background:var(--line-soft);margin-top:4px"><div style="width:100%;height:10px;border-radius:5px;background:var(--up)"></div></div></div>' +
      '<div><div class="row" style="font-size:13px"><span>IVVB11 · em reais</span><span class="up" style="font-weight:700">+3,6%</span></div><div style="height:10px;border-radius:5px;background:var(--line-soft);margin-top:4px"><div style="width:24%;height:10px;border-radius:5px;background:var(--accent)"></div></div></div></div></section>';
    var b = "";
    if (state.exTipo === "Ações EUA") {
      b = cambio + '<section><h2>Maiores altas e quedas do S&amp;P 500</h2><div class="list" style="margin-top:4px">' + DATA.exterior.map(function (e) { return '<div class="li"><span class="nm">' + e[0] + '<small>' + e[1] + '</small></span><span style="text-align:right"><span class="num ' + cls(e[2]) + '" style="display:block">' + pct(e[2], e[2] % 1 ? 1 : 0) + ' ano</span>' + (e[4] != null ? '<span class="num ' + cls(e[4]) + '" style="font-size:11px">US$ ' + fmt(e[3], 2) + ' · ' + pct(e[4], 2) + ' hoje</span>' : "") + '</span></div>'; }).join("") + '</div></section>' +
        '<section class="card"><h2>No radar dos analistas</h2><div class="row" style="margin-top:10px"><div><div style="font-weight:700">NVDA · Nvidia</div><div class="note">Recorde em 05/10 · ~US$ 5,8 tri · +28% no ano</div></div><div class="num" style="text-align:right;font-size:12px"><div>alvo US$ 300–345</div><div class="muted">MS · BNP</div></div></div></section>';
    } else if (state.exTipo === "ETFs") {
      b = cambio + '<section><h2>ETFs no ano</h2><div class="grid3" style="margin-top:8px">' + DATA.etfsUS.map(function (e) { return '<div class="tile"><div style="font-weight:800">' + e[0] + '</div><div class="k">' + e[1] + '</div><div class="v ' + cls(e[2]) + '">' + pct(e[2]) + '</div>' + (e[4] != null ? '<div class="num ' + cls(e[4]) + '" style="font-size:11px">' + pct(e[4], 2) + ' hoje</div>' : "") + '</div>'; }).join("") + '</div><p class="note" style="margin-top:8px">Aristocratas de dividendos (NOBL): 70 empresas, dividend yield perto de 2%.</p></section>';
    } else {
      b = '<section><h2>BDRs nas carteiras de outubro</h2><div class="list" style="margin-top:4px">' + DATA.bdrs.map(function (e) { return '<div class="li"><span class="nm">' + e[0] + '<small>' + e[1] + '</small></span><span class="note">' + e[2] + '</span></div>'; }).join("") + '</div></section>';
    }
    return head + '<div class="wrap" style="padding-top:12px">' + b + '</div>' + demoNote();
  }

  function telaCripto() {
    var max = 3.52;
    return '<header class="top"><h1>Cripto</h1></header><div class="wrap">' +
      '<section class="grid3 coins wide">' + DATA.cripto.map(function (c) { var d = c[2] < 10 ? 3 : c[2] < 1000 ? 2 : 0; return '<div class="tile"><div class="k" style="font-weight:600">' + c[0] + '</div><div class="v" style="font-size:14px">' + fmt(c[2], d) + '</div><div class="num ' + cls(c[3]) + '" style="font-size:11px">' + pct(c[3]) + '</div></div>'; }).join("") + '</section><div class="note" style="margin-top:-6px">' + (DATA.criptoLive ? "Preços em US$, variação em 24h" : "Preços em US$, variação no ano") + '</div>' +
      '<section class="card tall"><div class="eyebrow">Dinheiro entrando ou saindo</div><div style="font-size:14px;font-weight:700;margin-top:4px">ETFs de Bitcoin nos EUA, por mês</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">' +
      DATA.fluxoBTC.map(function (f) { var w = Math.max(4, Math.round(100 * Math.abs(f[1]) / max)); var c = f[1] >= 0 ? "up" : "down"; return '<div class="flow"><span class="lab">' + f[0] + '</span><span class="track"><i style="width:' + w + '%;background:var(--' + c + ')"></i></span><span class="val ' + c + '">' + (f[1] >= 0 ? "+" : "−") + 'US$ ' + fmt(Math.abs(f[1]), Math.abs(f[1]) < 1 ? 2 : 1) + ' bi</span></div>'; }).join("") +
      '</div><div class="note" style="margin-top:8px">Outubro até 12/10</div></section>' +
      '<section class="card down-c"><div class="eyebrow" style="color:var(--down-soft)">ETFs de Ether</div><div style="font-size:14px;font-weight:700;margin-top:4px">9 dias seguidos de saídas, cerca de US$ 697 milhões</div></section>' +
      '<section class="card"><div class="eyebrow">ETFs de Solana</div><div style="font-size:14px;font-weight:700;margin-top:4px">Fim de 14 semanas seguidas de entradas; patrimônio de US$ 1,73 bi</div></section>' +
      '<section class="card"><div class="eyebrow" style="color:var(--muted)">Na B3</div><div style="font-size:14px;font-weight:700;margin-top:4px">HASH11 cai 18,8% no ano</div></section>' +
      '</div>' + demoNote();
  }

  function telaNoticias() {
    var tabs = ["Hoje", "Últimas", "Agenda"];
    var head = '<header class="top"><h1>Notícias</h1><div class="tabs" role="tablist">' + tabs.map(function (t) { return '<button role="tab" data-ntab="' + t + '" aria-selected="' + (state.newsTab === t) + '">' + t + '</button>'; }).join("") + '</div></header>';
    var b = "";
    if (state.newsTab === "Hoje") {
      var bf = live.briefing || {};
      var man = bf.manchete || { titulo: "FMI projeta PIB mundial de 3,1% e diz que a resiliência chega ao limite", para_voce: "A projeção supõe Ormuz reabrindo só em março de 2027. Petróleo alto por mais tempo favorece Petrobras e pressiona inflação e juros." };
      var par = function (arr, def) { return (arr && arr.length) ? arr.map(function (x) { return [x.titulo, x.afeta]; }) : def; };
      b = '<section class="card wide"><div class="eyebrow">Manchete do dia · ' + (live.briefingDay || "13/10") + '</div><div style="font-size:18px;font-weight:800;line-height:1.25;margin-top:6px;text-wrap:balance">' + esc(man.titulo) + '</div><div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:1.45;color:#CBD5E1"><span class="eyebrow">Para você · </span>' + esc(man.para_voce) + '</div></section>' +
        cenario("up", "O que pode melhorar", par(bf.melhora, [["Acordo EUA–Irã reabre Ormuz", "petróleo ▼ · inflação ▼ · juros globais ▼"], ["Trégua energética Rússia–Ucrânia confirmada", "diesel ▼ · Europa ▲"], ["Leitura fiscal positiva após o 2º turno", "Ibovespa ▲ · real ▲ · juros futuros ▼"]])) +
        cenario("down", "O que pode piorar", par(bf.piora, [["Petróleo acima de US$ 110", "PETR4 ▲ · inflação ▲ · aéreas ▼"], ["Inflação interrompe os cortes da Selic", "renda fixa ▲ · ações ▼ · FIIs ▼"], ["Correção nas ações de IA nos EUA", "Nasdaq ▼ · IVVB11 ▼"]])) +
        '<section class="wide"><div class="row"><h2>Agenda</h2><button class="chip" data-ntab="Agenda">Ver tudo</button></div><div class="grid2" style="margin-top:8px;grid-template-columns:repeat(4,minmax(0,1fr))">' + DATA.agenda.map(function (a, i) { return '<div class="tile" style="padding:8px;' + (i === 0 ? "border-color:var(--accent)" : "") + '"><div class="num acc" style="font-size:11px;font-weight:700">' + a[0] + '</div><div style="font-size:12px;font-weight:600;margin-top:2px">' + a[1].replace("Inflação dos EUA (CPI)", "CPI EUA").replace("2º turno presidencial", "2º turno").replace("Decisão de juros do BCE", "BCE").replace("Copom decide a Selic", "Copom") + '</div></div>'; }).join("") + '</div></section>';
    } else if (state.newsTab === "Últimas") {
      var filtros = ["Todas", "Brasil", "Global", "Juros", "Petróleo", "Cripto"];
      var lab = { up: ["MELHORA", "up"], down: ["PIORA", "down"], neu: ["NEUTRO", "neu"] };
      var lst = DATA.noticias.filter(function (n) { return state.newsFiltro === "Todas" || n[1] === state.newsFiltro; });
      b = '<div class="chips" style="margin-inline:-16px" role="group" aria-label="Tema">' + filtros.map(function (f) { return '<button class="chip" data-nfiltro="' + f + '" aria-pressed="' + (state.newsFiltro === f) + '">' + f + '</button>'; }).join("") + '</div>' +
        lst.map(function (n) { var l = lab[n[3]]; return '<article class="card" style="padding:12px 14px"><div class="row num" style="font-size:10px"><span class="muted">' + n[0] + ' · ' + n[1].toUpperCase() + '</span><span class="pill ' + l[1] + '">' + l[0] + '</span></div><div style="font-size:15px;font-weight:700;margin-top:6px;line-height:1.35">' + (n[4] ? '<a href="' + esc(n[4]) + '" target="_blank" rel="noopener" style="color:var(--fg);text-decoration:none">' + esc(n[2]) + '</a>' : esc(n[2])) + '</div>' + (n[5] ? '<div class="note" style="margin-top:4px">' + esc(n[5]) + '</div>' : "") + '</article>'; }).join("") +
        (!lst.length ? '<p class="note">Nenhuma notícia deste tema na demonstração.</p>' : "");
    } else {
      b = '<section><div class="list">' + DATA.agenda.map(function (a) { return '<div class="li" style="align-items:flex-start"><span class="num acc" style="width:52px;font-weight:700">' + a[0] + '</span><span style="flex:1"><span style="display:block;font-weight:700">' + a[1] + '</span><span class="note">' + a[2] + '</span></span></div>'; }).join("") + '</div></section>';
    }
    return head + '<div class="wrap" style="padding-top:12px">' + b + '</div>' + demoNote();
  }
  function cenario(tipo, titulo, itens) {
    var c = tipo === "up" ? "up-soft" : "down-soft";
    return '<section class="card ' + tipo + '-c"><div class="eyebrow" style="color:var(--' + c + ');font-weight:700">' + (tipo === "up" ? "▲ " : "▼ ") + titulo + '</div><div style="display:flex;flex-direction:column;gap:9px;margin-top:9px">' +
      itens.map(function (i) { return '<div><div style="font-size:14px;font-weight:700;line-height:1.35">' + esc(i[0] || "") + '</div><div class="note">Afeta: ' + esc(i[1] || "") + '</div></div>'; }).join("") + '</div></section>';
  }

  // ---------- Render e eventos ----------
  var screen = document.getElementById("screen"), nav = document.getElementById("nav");
  function render() {
    var html = state.login ? telaLogin() : state.ativo ? telaFicha() : { inicio: telaInicio, brasil: telaBrasil, exterior: telaExterior, cripto: telaCripto, noticias: telaNoticias }[state.tab]();
    screen.innerHTML = '<div class="screen">' + html + '</div>';
    nav.innerHTML = '<div class="brand">Radar<span class="acc">Invest</span></div>' + TABS.map(function (t) { return '<button data-tab="' + t[0] + '"' + (state.tab === t[0] ? ' aria-current="page"' : "") + '>' + svgIcon(t[0]) + t[1] + '</button>'; }).join("");
  }
  function go(tab) { state.tab = tab; state.ativo = null; state.login = false; try { history.replaceState(null, "", "#" + tab); } catch (e) {} render(); window.scrollTo(0, 0); }

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("button"); if (!el) return;
    var d = el.dataset;
    if (d.tab) return go(d.tab);
    if (d.ativo) { state.ativo = d.ativo; state.fichaTab = "Resumo"; render(); window.scrollTo(0, 0); return; }
    if (d.voltar !== undefined) { state.ativo = null; render(); return; }
    if (d.seguir) { seguir(d.seguir); return; }
    if (d.gerar) { gerarAnalise(d.gerar); return; }
    if (d.entrar !== undefined || d.conta !== undefined) { state.login = true; live.loginMsg = ""; render(); window.scrollTo(0, 0); return; }
    if (d.fecharLogin !== undefined) { state.login = false; render(); return; }
    if (d.sair !== undefined) { if (sb) sb.auth.signOut(); live.user = null; state.login = false; render(); return; }
    if (d.btipo) { state.brasilTipo = d.btipo; render(); return; }
    if (d.setor) { state.brasilSetor = d.setor; render(); return; }
    if (d.ftab) { state.fichaTab = d.ftab; render(); return; }
    if (d.extipo) { state.exTipo = d.extipo; render(); return; }
    if (d.ntab) { state.newsTab = d.ntab; render(); return; }
    if (d.nfiltro) { state.newsFiltro = d.nfiltro; render(); return; }
    if (d.periodo) { state.periodo = d.periodo; render(); return; }
  });

  var h = (location.hash || "").replace("#", "");
  if (["inicio", "brasil", "exterior", "cripto", "noticias"].indexOf(h) >= 0) state.tab = h;
  render();

  // Login por link no e-mail
  document.addEventListener("submit", function (ev) {
    if (ev.target.id !== "login-form") return;
    ev.preventDefault();
    var email = document.getElementById("login-email").value.trim();
    if (!sb || !email) return;
    live.loginMsg = "Enviando…"; render();
    sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.origin } }).then(function (r) {
      live.loginMsg = r.error ? "Não foi possível enviar o link: " + r.error.message : "Pronto. Abra o e-mail que enviamos para " + email + " e toque no link para entrar.";
      render();
    });
  });

  if (sb) {
    sb.auth.getSession().then(function (r) { live.user = r.data && r.data.session ? r.data.session.user : null; if (live.user) syncListaRemota(); render(); });
    sb.auth.onAuthStateChange(function (_e, session) {
      var antes = live.user; live.user = session ? session.user : null;
      if (live.user && !antes) { state.login = false; syncListaRemota(); }
      render();
    });
  }
  loadLive();
  setInterval(function () { if (document.visibilityState === "visible") loadLive(); }, 5 * 60 * 1000);

  if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); }); }
})();
</script>

</body>
</html>

* { box-sizing: border-box; }

.avatar { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; }

@media (min-width: 1024px) {

  .app { max-width: 1180px; margin: 0 auto; padding: 24px 40px 48px 280px; }

  .wrap > .wide { grid-column: 1 / -1; }

  .segbox { margin-inline: 0; max-width: 640px; }
  .rk-search { padding-inline: 0 !important; max-width: 640px; }
  .hscroll { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; overflow: visible; }
  .demo { margin: 20px 0 0; }
  .tabs { max-width: 640px; }
  .grid3.coins { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .app header.row { padding-inline: 0; }
  .ficha-top { display: grid; grid-template-columns: minmax(0, 1fr); }

  var IND = {
    acao: [["dy", "Dividend yield 12m", "%"], ["pl", "P/L", "x"], ["pvp", "P/VP", "x"], ["roe", "ROE", "%"], ["mrg_liq", "Margem líquida", "%"], ["div_pl", "Dívida / patrimônio", "x"], ["cresc_5a", "Crescimento receita 5 anos", "%"], ["ev_ebit", "EV/EBIT", "x"], ["pl_setor", "P/L médio do setor", "x"], ["ret_1m", "Retorno 1 mês", "±"], ["ret_3m", "Retorno 3 meses", "±"], ["dist_high52", "Distância da máxima 52s", "±"], ["high52", "Máxima 52 semanas", "$"], ["low52", "Mínima 52 semanas", "$"], ["vol_anual", "Volatilidade anual", "%"], ["liq_2m", "Liquidez diária", "big"], ["market_cap", "Valor de mercado", "big"]],
    fii: [["dy", "Dividend yield 12m", "%"], ["pvp", "P/VP", "x"], ["ffo_yield", "FFO yield", "%"], ["cap_rate", "Cap rate", "%"], ["vacancia", "Vacância", "%"], ["imoveis", "Imóveis", "int"], ["liq", "Liquidez diária", "big"], ["valor_mercado", "Valor de mercado", "big"], ["ret_3m", "Retorno 3 meses", "±"], ["dist_high52", "Distância da máxima 52s", "±"]],
    etf: [["ret_1m", "Retorno 1 mês", "±"], ["ret_3m", "Retorno 3 meses", "±"], ["dist_high52", "Distância da máxima 52s", "±"], ["vol_anual", "Volatilidade anual", "%"]],
    us: [["dy", "Dividend yield", "%"], ["pl", "P/L", "x"], ["pvp", "P/VP", "x"], ["roe", "ROE", "%"], ["mrg_liq", "Margem líquida", "%"], ["beta", "Beta", "x"], ["consenso", "Analistas que recomendam compra", "%"], ["analistas", "Analistas cobrindo", "int"], ["ret_3m", "Retorno 3 meses", "±"], ["ret_12m", "Retorno 12 meses", "±"], ["dist_high52", "Distância da máxima 52s", "±"], ["high52", "Máxima 52 semanas", "$"], ["low52", "Mínima 52 semanas", "$"]],
    cripto: [["rank", "Posição no ranking", "int"], ["market_cap", "Valor de mercado", "big"], ["ch_7d", "7 dias", "±"], ["ch_30d", "30 dias", "±"], ["ch_1y", "1 ano", "±"], ["ath", "Recorde histórico", "$"], ["ath_pct", "Distância do recorde", "±"]]
  };
  function indicadores(s) {
    var d = s.data || {}, m = moedaDe(s);
    return '<section class="grid2 wide">' + (IND[s.kind] || []).map(function (x) {
      var v = d[x[0]]; if (v == null || !isFinite(v)) return "";
      var t = x[2] === "%" ? fmt(v, 1) + "%" : x[2] === "±" ? pct(v, 1) : x[2] === "x" ? fmt(v, 2) : x[2] === "int" ? fmt(v, 0) : x[2] === "big" ? grande(v, m) : precoFmt(v, m);
      return tile(x[1], t, "", x[2] === "±" ? cls(v) : "muted");
    }).join("") + '</section>';
  }
  function cartaoRadar(s) {
    var n = nota(s), ss = sinaisOrdenados(s);
    return '<section class="card wide"><div style="display:flex;gap:14px;align-items:center">' + ring(n, 64) + '<div style="flex:1;min-width:0"><div class="eyebrow">Radar Score · ' + state.perfil + '</div>' +
      '<div style="font-size:13px;line-height:1.45;margin-top:4px">' + esc(traduzSetores(s.resumo || "")) + '</div></div></div>' +
      '<div style="display:flex;flex-direction:column;gap:7px;margin-top:12px">' + PILARES.map(function (x) {
        var v = (s.pillars || {})[x[0]];
        return '<div class="flow"><span class="lab" style="width:76px;font-family:var(--font-ui);font-size:12px">' + x[2] + '</span><span class="track"><span style="display:block;height:8px;border-radius:4px;background:var(--line-soft)"><i style="height:8px;width:' + (v == null ? 0 : v) + '%;background:' + corNota(v) + '"></i></span></span><span class="val" style="width:36px">' + (v == null ? "—" : v) + '</span></div>';
      }).join("") + '</div>' +
      (ss.length ? '<div style="display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft)">' + ss.map(function (x) {
        var c = x.tom === "up" ? "up-soft" : x.tom === "down" ? "down-soft" : "accent";
        return '<div style="font-size:13px;line-height:1.4"><span style="color:var(--' + c + ')">' + (x.tom === "up" ? "▲" : x.tom === "down" ? "▼" : "◆") + '</span> ' + esc(x.txt) + '</div>';
      }).join("") + '</div>' : "") + '</section>';
  }

  // Carregamento das tabelas do Radar (paginado: o Supabase devolve no máximo 1000 linhas por vez)
  function selectAll(table, cols, ordem) {
    var out = [], size = 1000;
    function page(from) {
      return sb.from(table).select(cols).order(ordem).range(from, from + size - 1).then(function (r) {
        if (r.error) throw r.error;
        out = out.concat(r.data || []);
        return (r.data || []).length === size ? page(from + size) : out;
      });
    }
    return page(0);
  }
  function loadRadar() {
    if (!sb) { R.carregando = false; return; }
    var y = new Date().getFullYear(), desde = new Date(Date.now() - 50 * 864e5).toISOString().slice(0, 10);
    Promise.all([
      selectAll("scores", "symbol,name,kind,sector,price,change_pct,pillars,signals,resumo,data,updated_at", "symbol"),
      sb.from("market_signals").select("*"),
      sb.from("macro").select("*"),
      sb.from("focus").select("indicador,ref_year,data,mediana").in("ref_year", [String(y), String(y + 1)]).gte("data", desde).order("data", { ascending: false }).limit(1000),
      sb.from("crypto_markets").select("*").order("rank").limit(100)
    ]).then(function (r) {
      R.carregando = false;
      var sc = r[0] || [];
      R.scores = sc; R.bySym = {}; var nv = 0;
      sc.forEach(function (s) { if (!R.bySym[s.symbol] || R.bySym[s.symbol].kind === "cripto") R.bySym[s.symbol] = s; var t = new Date(s.updated_at).getTime(); if (t > nv) nv = t; });
      R.updated = nv ? new Date(nv).toISOString() : null;
      R.msig = (r[1].data || []);
      R.macro = {}; (r[2].data || []).forEach(function (m) { R.macro[m.key] = m; });
      R.focus = {};
      var porSerie = {}; (r[3].data || []).forEach(function (f) { var k = f.indicador + "|" + f.ref_year; (porSerie[k] = porSerie[k] || []).push(f); });
      Object.keys(porSerie).forEach(function (k) {
        var arr = porSerie[k], ult = arr[0], lim = new Date(new Date(ult.data).getTime() - 27 * 864e5), antigo = null;
        for (var i = 0; i < arr.length; i++) if (new Date(arr[i].data) <= lim) { antigo = arr[i]; break; }
        R.focus[k] = { v: Number(ult.mediana), d: antigo ? Number(ult.mediana) - Number(antigo.mediana) : null, data: ult.data };
      });
      R.cripto = r[4].data || [];
      R.ok = sc.length > 0;
      render();
    }).catch(function () { R.carregando = false; render(); });
  }

  function acharAtivo(t) {
    var a = acharAcao(t), s = R.bySym[t] || null;
    if (a) { a.score = s; return a; }
    if (!s) return null;
    return { t: s.symbol, n: s.name || "", s: s.kind === "cripto" ? "Cripto " + (s.sector || "") : setorPT(s.sector) || "", dy: (s.data || {}).dy != null ? s.data.dy : null, ano: null,
      preco: s.price, hoje: s.change_pct, moeda: moedaDe(s), carteiras: [], alvos: [], score: s, generico: true };
  }

  // ---------- Render e eventos ----------
  var screen = document.getElementById("screen"), nav = document.getElementById("nav");
  function render() {
    var html = state.login ? telaLogin() : state.ativo ? telaFicha() : { inicio: telaInicio, radar: telaRadar, brasil: telaBrasil, exterior: telaExterior, cripto: telaCripto, noticias: telaNoticias }[state.tab]();
    screen.innerHTML = '<div class="screen">' + html + '</div>';
    nav.innerHTML = '<div class="brand">Radar<span class="acc">Invest</span></div>' + TABS.map(function (t) { return '<button data-tab="' + t[0] + '"' + (state.tab === t[0] ? ' aria-current="page"' : "") + '>' + svgIcon(t[0]) + t[1] + '</button>'; }).join("");
  }
  function go(tab) { state.tab = tab; state.ativo = null; state.login = false; try { history.replaceState(null, "", "#" + tab); } catch (e) {} render(); window.scrollTo(0, 0); }

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("button"); if (!el) return;
    var d = el.dataset;
    if (d.tab) return go(d.tab);
    if (d.ativo) { state.ativo = d.ativo; state.fichaTab = "Resumo"; render(); window.scrollTo(0, 0); return; }
    if (d.voltar !== undefined) { state.ativo = null; render(); return; }
    if (d.seguir) { seguir(d.seguir); return; }
    if (d.gerar) { gerarAnalise(d.gerar); return; }
    if (d.entrar !== undefined || d.conta !== undefined) { state.login = true; live.loginMsg = ""; render(); window.scrollTo(0, 0); return; }
    if (d.fecharLogin !== undefined) { state.login = false; render(); return; }
    if (d.sair !== undefined) { if (sb) sb.auth.signOut(); live.user = null; state.login = false; render(); return; }
    if (d.btipo) { state.brasilTipo = d.btipo; render(); return; }
    if (d.setor) { state.brasilSetor = d.setor; render(); return; }
    if (d.ftab) { state.fichaTab = d.ftab; render(); return; }
    if (d.extipo) { state.exTipo = d.extipo; render(); return; }
    if (d.ntab) { state.newsTab = d.ntab; render(); return; }
    if (d.nfiltro) { state.newsFiltro = d.nfiltro; render(); return; }
    if (d.periodo) { state.periodo = d.periodo; render(); return; }
    if (d.rtab) { state.radarTab = d.rtab; render(); return; }
    if (d.rkclasse) { state.rkClasse = d.rkclasse; state.rkSetor = "Todos"; state.rkLimite = 30; render(); return; }
    if (d.rksetor) { state.rkSetor = d.rksetor; state.rkLimite = 30; render(); return; }
    if (d.perfil) { state.perfil = d.perfil; try { localStorage.setItem("radar-perfil", d.perfil); } catch (e) {} render(); return; }
    if (d.sigfiltro) { state.sigFiltro = d.sigfiltro; state.sigLimite = 25; render(); return; }
    if (d.mais === "sig") { state.sigLimite += 25; render(); return; }
    if (d.mais === "rk") { state.rkLimite += 30; render(); return; }
    if (d.mais === "cripto") { state.criptoLimite += 30; render(); return; }
    if (d.irradar) { state.radarTab = "Ranking"; state.rkClasse = d.irradar; state.rkSetor = "Todos"; state.rkBusca = ""; go("radar"); return; }
    if (d.irsinais !== undefined) { state.radarTab = "Sinais"; go("radar"); return; }
  });

  document.addEventListener("input", function (ev) {
    if (ev.target.id !== "rk-busca") return;
    state.rkBusca = ev.target.value; state.rkLimite = 30; render();
    var el = document.getElementById("rk-busca"); if (el) { el.focus(); var n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) {} }
  });
  var h = (location.hash || "").replace("#", "");
  if (["inicio", "radar", "brasil", "exterior", "cripto", "noticias"].indexOf(h) >= 0) state.tab = h;
  render();

  // Login por link no e-mail
  document.addEventListener("submit", function (ev) {
    if (ev.target.id !== "login-form") return;
    ev.preventDefault();
    var email = document.getElementById("login-email").value.trim();
    if (!sb || !email) return;
    live.loginMsg = "Enviando…"; render();
    sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.origin } }).then(function (r) {
      live.loginMsg = r.error ? "Não foi possível enviar o link: " + r.error.message : "Pronto. Abra o e-mail que enviamos para " + email + " e toque no link para entrar.";
      render();
    });
  });

  if (sb) {
    sb.auth.getSession().then(function (r) { live.user = r.data && r.data.session ? r.data.session.user : null; if (live.user) syncListaRemota(); render(); });
    sb.auth.onAuthStateChange(function (_e, session) {
      var antes = live.user; live.user = session ? session.user : null;
      if (live.user && !antes) { state.login = false; syncListaRemota(); }
      render();
    });
  }
  loadLive(); loadRadar();
  setInterval(function () { if (document.visibilityState === "visible") { loadLive(); loadRadar(); } }, 5 * 60 * 1000);

  if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); }); }
})();
</script>

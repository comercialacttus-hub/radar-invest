<style>
/* Layout: app de uma coluna (máx. 480px) com barra de abas fixa embaixo; terminal escuro, âmbar como destaque */
:root {
  --bg: #07090D;
  --surface: #11161E;
  --line: #222B38;
  --line-soft: #1A212C;
  --fg: #F1F5F9;
  --muted: #94A3B8;
  --accent: #F59E0B;
  --accent-ink: #07090D;
  --up: #22C55E;
  --up-soft: #4ADE80;
  --up-bg: #0F2A1A;
  --up-line: #14532D;
  --down: #EF4444;
  --down-soft: #F87171;
  --down-bg: #2A1212;
  --down-line: #7F1D1D;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

}
* { box-sizing: border-box; }
html, body { height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
input.field { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0 14px; font: inherit; font-size: 16px; }
.btn { min-height: 48px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 0 18px; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.status { font-family: var(--font-num); font-size: 10px; border: 1px solid var(--line); border-radius: 20px; padding: 6px 10px; color: var(--muted); white-space: nowrap; }
.status.on { color: var(--up-soft); border-color: var(--up-line); }
.avatar { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
.wrap { padding-inline: 16px; display: flex; flex-direction: column; gap: 14px; padding-block: 0 16px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); } .acc { color: var(--accent); }
.eyebrow { font-family: var(--font-num); font-size: 10px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }
h1 { margin: 0; font-size: 24px; font-weight: 800; text-wrap: balance; }
h2 { margin: 0; font-size: 16px; font-weight: 800; text-wrap: balance; }
.top { padding: 18px 16px 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.card.up-c { background: var(--up-bg); border-color: var(--up-line); }
.card.down-c { background: var(--down-bg); border-color: var(--down-line); }
.card.hero-acc { background: var(--accent); color: var(--accent-ink); border: 0; }
.card.hero-acc .eyebrow { color: var(--accent-ink); font-weight: 700; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile .k { font-size: 11px; color: var(--muted); }
.tile .v { font-family: var(--font-num); font-size: 16px; font-weight: 700; margin-top: 2px; }
.tabs { display: flex; gap: 18px; margin-top: 10px; border-bottom: 1px solid var(--line-soft); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 0 0 8px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; min-height: 36px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 16px 4px; scrollbar-width: none; }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; min-height: 48px; }
.li:last-child { border-bottom: 0; }
.li .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; }
.li .nm small { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 4px; }
.bar { display: block; height: 6px; border-radius: 3px; background: var(--line-soft); width: 90px; flex: none; }
.bar i { display: block; height: 6px; border-radius: 3px; }
.hscroll { display: flex; gap: 10px; overflow-x: auto; padding-inline: 16px; margin-inline: -16px; scrollbar-width: none; }
.dycard { flex: none; width: 148px; text-align: left; }
.dycard .big { font-family: var(--font-num); font-size: 26px; font-weight: 700; color: var(--accent); margin-top: 10px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 34px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.pill { display: inline-block; font-family: var(--font-num); font-size: 10px; border-radius: 6px; padding: 4px 7px; }
.pill.up { background: var(--up-bg); color: var(--up-soft); } .pill.down { background: var(--down-bg); color: var(--down-soft); } .pill.neu { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
.dots { display: flex; gap: 3px; } .dots span { width: 18px; height: 8px; border-radius: 2px; background: var(--line); } .dots span.on { background: var(--accent); }
.note { font-size: 11px; color: var(--muted); line-height: 1.45; }
.flow { display: flex; align-items: center; gap: 8px; font-family: var(--font-num); font-size: 12px; }
.flow .lab { width: 34px; color: var(--muted); } .flow .track { flex: 1; } .flow .track i { display: block; height: 14px; border-radius: 4px; } .flow .val { width: 82px; text-align: right; }
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; background: #0B0F15; border-top: 1px solid var(--line-soft); padding: 6px 4px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
nav.bottom .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
nav.bottom button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; color: var(--muted); font-size: 10px; }
nav.bottom button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.back { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; }
.follow { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-size: 12px; font-weight: 700; }
.follow[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.demo { margin: 4px 16px 0; font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; line-height: 1.4; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl td, .tbl th { padding: 9px 0; border-bottom: 1px solid var(--line-soft); text-align: left; }
.tbl th { font-size: 11px; color: var(--muted); font-weight: 600; }
.tbl td.r, .tbl th.r { text-align: right; padding-left: 8px; }
@media (max-width: 520px) { .hide-m { display: none; } }
.brand { display: none; }
.chart { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: crosshair; }
.chart svg { display: block; }
.ch-y { position: absolute; right: 0; font-family: var(--font-num); font-size: 9px; color: #475569; transform: translateY(-100%); pointer-events: none; }
.ch-x { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed rgba(241,245,249,.5); pointer-events: none; }
.ch-dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 5px; border: 2px solid var(--bg); pointer-events: none; box-shadow: 0 0 0 5px rgba(241,245,249,.12); }
.ch-tip { position: absolute; top: 2px; transform: translate(-50%, 0); background: rgba(30,38,51,.94); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-family: var(--font-num); font-size: 11px; white-space: nowrap; pointer-events: none; z-index: 2; }
.ch-tip b { display: block; font-size: 13px; color: var(--fg); }
@media (prefers-reduced-motion: no-preference) { .chart .ln { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s ease-out forwards; } @keyframes draw { to { stroke-dashoffset: 0; } } }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ring { flex: none; }
.pil { display: flex; gap: 3px; align-items: flex-end; height: 18px; margin-top: 6px; }
.pil > span { width: 16px; border-radius: 2px; background: var(--accent); }
.pil > span.na { background: var(--line); height: 2px; }
.pil small { font-family: var(--font-num); font-size: 9px; color: var(--muted); margin-left: 6px; letter-spacing: 1px; }
.sig { font-size: 12px; line-height: 1.4; margin-top: 6px; }
.sig.up { color: var(--up-soft); } .sig.down { color: var(--down-soft); } .sig.neu { color: var(--accent); }
.rk { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line-soft); padding: 12px 0; }
.rk-b { flex: 1; min-width: 0; display: block; }
.rk-t { font-weight: 800; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk-t small { font-weight: 400; font-size: 12px; color: var(--muted); }
.mcard { flex: none; width: 176px; border-radius: 14px; padding: 12px; background: var(--surface); border: 1px solid var(--line); }
.mcard.mc-up { background: var(--up-bg); border-color: var(--up-line); }
.mcard.mc-down { background: var(--down-bg); border-color: var(--down-line); }
.mcard.mc-acc { border-color: var(--accent); }
.segbox { margin: 10px 16px 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.segbox button { min-height: 34px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 13px; }
.segbox button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.score-pill { font-family: var(--font-num); font-size: 11px; font-weight: 700; border-radius: 6px; padding: 3px 6px; border: 1px solid var(--line); }
/* Desktop: menu lateral fixo + conteúdo em duas colunas */
@media (min-width: 1024px) {
  body { font-size: 15px; }
  .app { max-width: 1180px; margin: 0 auto; padding: 24px 40px 48px 280px; }
  nav.bottom { top: 0; bottom: 0; right: auto; width: 230px; border-top: 0; border-right: 1px solid var(--line-soft); padding: 28px 16px; }
  nav.bottom .in { display: flex; flex-direction: column; gap: 4px; max-width: none; }
  nav.bottom .brand { display: block; font-weight: 800; font-size: 20px; padding: 0 12px 24px; color: var(--fg); }
  nav.bottom button { flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 14px; padding: 0 12px; border-radius: 10px; min-height: 44px; }
  nav.bottom button:hover { background: var(--surface); color: var(--fg); }
  nav.bottom button[aria-current="page"] { background: var(--surface); }
  .top { padding: 8px 0 12px; }
  h1 { font-size: 30px; }
  .wrap { padding-inline: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; grid-auto-flow: row dense; }
  .wrap > .tall { grid-row: span 3; }
  .wrap > .wide { grid-column: 1 / -1; }
  .wrap > .chips, .wrap > .note { grid-column: 1 / -1; }
  .chips { padding-inline: 0; }
  .segbox { margin-inline: 0; max-width: 640px; }
  .rk-search { padding-inline: 0 !important; max-width: 640px; }
  .hscroll { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; overflow: visible; }
  .demo { margin: 20px 0 0; }
  .tabs { max-width: 640px; }

  .app header.row { padding-inline: 0; }
  .ficha-top { display: grid; grid-template-columns: minmax(0, 1fr); }
}

.fhero.fdn { background: linear-gradient(180deg, #3A1414 0%, var(--bg) 100%); }

@media (prefers-reduced-motion: no-preference) {
  .needle { animation: needle 1s cubic-bezier(.2,.8,.2,1) both; } @keyframes needle { from { transform: rotate(0deg); } }

}
@media (min-width: 1024px) {
  .hero { margin-inline: 0; padding-inline: 0; }

  .stories { margin-inline: 0; padding-inline: 0; }
  .tmap { height: 300px; }

}

  // Carregamento das tabelas do Radar (paginado: o Supabase devolve no máximo 1000 linhas por vez)

    if (a) { a.score = s; return a; }
    if (!s) return null;
    return { t: s.symbol, n: s.name || "", s: s.kind === "cripto" ? "Cripto " + (s.sector || "") : setorPT(s.sector) || "", dy: (s.data || {}).dy != null ? s.data.dy : null, ano: null,
      preco: s.price, hoje: s.change_pct, moeda: moedaDe(s), carteiras: [], alvos: [], score: s, generico: true };
  }

  // ---------- Render e eventos ----------
  var screen = document.getElementById("screen"), nav = document.getElementById("nav");
  function render() {
    var html = state.login ? telaLogin() : state.ativo ? telaFicha() : { inicio: telaInicio, radar: telaRadar, brasil: telaBrasil, exterior: telaExterior, cripto: telaCripto, noticias: telaNoticias }[state.tab]();
    screen.innerHTML = '<div class="screen">' + html + '</div>';
    nav.innerHTML = '<div class="brand">Radar<span class="acc">Invest</span></div>' + TABS.map(function (t) { return '<button data-tab="' + t[0] + '"' + (state.tab === t[0] ? ' aria-current="page"' : "") + '>' + svgIcon(t[0]) + t[1] + '</button>'; }).join("");
  }
  function go(tab) { state.tab = tab; state.ativo = null; state.login = false; try { history.replaceState(null, "", "#" + tab); } catch (e) {} render(); window.scrollTo(0, 0); }

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("button"); if (!el) return;
    if (el.dataset.mapa !== undefined) { state.mapaSetor = el.dataset.mapa && state.mapaSetor !== el.dataset.mapa ? el.dataset.mapa : null; render(); return; }
    if (el.dataset.irmacro !== undefined) { state.radarTab = "Macro"; go("radar"); return; }
    var d = el.dataset;
    if (d.tab) return go(d.tab);
    if (d.ativo) { state.ativo = d.ativo; state.fichaTab = "Resumo"; render(); window.scrollTo(0, 0); return; }
    if (d.voltar !== undefined) { state.ativo = null; render(); return; }
    if (d.seguir) { seguir(d.seguir); return; }
    if (d.gerar) { gerarAnalise(d.gerar); return; }
    if (d.entrar !== undefined || d.conta !== undefined) { state.login = true; live.loginMsg = ""; render(); window.scrollTo(0, 0); return; }
    if (d.fecharLogin !== undefined) { state.login = false; render(); return; }
    if (d.sair !== undefined) { if (sb) sb.auth.signOut(); live.user = null; state.login = false; render(); return; }
    if (d.btipo) { state.brasilTipo = d.btipo; render(); return; }
    if (d.setor) { state.brasilSetor = d.setor; render(); return; }
    if (d.ftab) { state.fichaTab = d.ftab; render(); return; }
    if (d.extipo) { state.exTipo = d.extipo; render(); return; }
    if (d.ntab) { state.newsTab = d.ntab; render(); return; }
    if (d.nfiltro) { state.newsFiltro = d.nfiltro; render(); return; }
    if (d.periodo) { state.periodo = d.periodo; render(); return; }
    if (d.fperiodo) { state.fichaPeriodo = d.fperiodo; render(); return; }
    if (d.rtab) { state.radarTab = d.rtab; render(); return; }
    if (d.rkclasse) { state.rkClasse = d.rkclasse; state.rkSetor = "Todos"; state.rkLimite = 30; render(); return; }
    if (d.rksetor) { state.rkSetor = d.rksetor; state.rkLimite = 30; render(); return; }
    if (d.perfil) { state.perfil = d.perfil; try { localStorage.setItem("radar-perfil", d.perfil); } catch (e) {} render(); return; }
    if (d.sigfiltro) { state.sigFiltro = d.sigfiltro; state.sigLimite = 25; render(); return; }
    if (d.mais === "sig") { state.sigLimite += 25; render(); return; }
    if (d.mais === "rk") { state.rkLimite += 30; render(); return; }
    if (d.mais === "cripto") { state.criptoLimite += 30; render(); return; }
    if (d.irradar) { state.radarTab = "Ranking"; state.rkClasse = d.irradar; state.rkSetor = "Todos"; state.rkBusca = ""; go("radar"); return; }
    if (d.irsinais !== undefined) { state.radarTab = "Sinais"; go("radar"); return; }
  });

  document.addEventListener("input", function (ev) {
    if (ev.target.id !== "rk-busca") return;
    state.rkBusca = ev.target.value; state.rkLimite = 30; render();
    var el = document.getElementById("rk-busca"); if (el) { el.focus(); var n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) {} }
  });
  var h = (location.hash || "").replace("#", "");
  if (["inicio", "radar", "brasil", "exterior", "cripto", "noticias"].indexOf(h) >= 0) state.tab = h;
  render();

  // Login por link no e-mail
  document.addEventListener("submit", function (ev) {
    if (ev.target.id !== "login-form") return;
    ev.preventDefault();
    var email = document.getElementById("login-email").value.trim();
    if (!sb || !email) return;
    live.loginMsg = "Enviando…"; render();
    sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.origin } }).then(function (r) {
      live.loginMsg = r.error ? "Não foi possível enviar o link: " + r.error.message : "Pronto. Abra o e-mail que enviamos para " + email + " e toque no link para entrar.";
      render();
    });
  });

  if (sb) {
    sb.auth.getSession().then(function (r) { live.user = r.data && r.data.session ? r.data.session.user : null; if (live.user) syncListaRemota(); render(); });
    sb.auth.onAuthStateChange(function (_e, session) {
      var antes = live.user; live.user = session ? session.user : null;
      if (live.user && !antes) { state.login = false; syncListaRemota(); }
      render();
    });
  }
  loadLive(); loadRadar();
  setInterval(function () { if (document.visibilityState === "visible") { loadLive(); loadRadar(); } }, 5 * 60 * 1000);

  if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); }); }
})();
</script>

</html>
